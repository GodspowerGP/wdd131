<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyoto Explorer - Trip Planner</title>
    <meta name="description" content="Use our interactive trip planner to build a personalized packing list for your Kyoto vacation. Add, check off, and save items with ease.">
    <meta name="author" content="Godspower Ulonna">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/planner.js" defer></script>
</head>
<body>
    <header>
        <h1>🏯 Kyoto Explorer</h1>
        <button id="menu" aria-label="Toggle Menu"></button>
        <nav>
            <ul id="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="attractions.html">Attractions</a></li>
                <li><a href="planner.html" class="active">Trip Planner</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Interactive Packing List</h2>
        
        <div class="planner-container">
            <div class="packing-form">
                <h3>Add New Item</h3>
                <form id="packing-form">
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" name="itemName" required placeholder="e.g., Passport">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Essentials">Essentials</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Toiletries">Toiletries</option>
                        </select>
                    </div>
                    <button type="submit">Add to List</button>
                </form>
            </div>

            <div class="packing-list-display">
                <h3>Your List <span id="item-count">(0)</span></h3>
                <p id="empty-msg">Your list is currently empty. Add items to start packing!</p>
                <ul id="packing-items">
                    <!-- Items rendered dynamically via JS -->
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Kyoto Explorer | Godspower Ulonna</p>
        <p id="lastModified"></p>
        <p><a href="references.html">References & Citations</a></p>
    </footer>
</body>
</html>
